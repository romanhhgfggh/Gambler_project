{% extends 'pages/base.html' %}

{% block content %}
<div class="page-header">
    <h1>Вхід у систему</h1>
</div>

<div style="display: flex; justify-content: center; margin-top: 30px;">
    <div class="card-smc" style="width: 400px; flex-direction: column; align-items: stretch; border-top: 6px solid #28a745;">
        <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}
            
            {% for field in form %}
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="font-weight: bold; color: #2c3e50; margin-bottom: 8px;">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        {{ field.errors }}
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-custom btn-success-custom" style="width: 100%; margin-top: 10px; margin-right: 0;">Увійти</button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee;">
            <a href="{% url 'password_reset' %}" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">Забули пароль? Відновити</a>
        </div>
    </div>
</div>
{% endblock %}
