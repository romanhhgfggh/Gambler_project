{% extends 'pages/base.html' %}

{% block content %}
<div class="page-header">
    <h1>Створити акаунт</h1>
</div>

<div style="display: flex; justify-content: center; margin-top: 30px;">
    <div class="card-smc" style="width: 400px; flex-direction: column; align-items: stretch; border-top: 6px solid #2c3e50;">
        <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}
            
            {% for field in form %}
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="font-weight: bold; color: #2c3e50; margin-bottom: 8px;">{{ field.label }}</label>
                    
                    {{ field }}
                    
                    {% if field.errors %}
                        {{ field.errors }}
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-custom btn-primary-custom" style="width: 100%; margin-top: 10px;">Зареєструватись</button>
        </form>
    </div>
</div>
{% endblock %}
