{% extends 'base.html' %}
{% block content %}
<style>
    .auth-container { display: flex; justify-content: center; align-items: center; padding: 40px 0; flex-direction: column; }
    .auth-title { color: #1e3a5f; font-size: 32px; font-weight: bold; margin-bottom: 25px; }
    .auth-card { background: #fff; width: 400px; border-radius: 8px; border-top: 6px solid #28a745; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 35px; box-sizing: border-box; }
    .auth-form label { display: block; font-weight: bold; color: #1e3a5f; margin-bottom: 8px; font-size: 14px; }
    .auth-form input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ced4da; border-radius: 4px; background-color: #f8f9fa; color: #333; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s; }
    .auth-form input:focus { outline: none; border: 1px solid #f1c40f; background-color: #fff; }
    .auth-btn { width: 100%; background-color: #28a745; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
    .auth-btn:hover { background-color: #218838; }
</style>

<div class="auth-container">
    <h1 class="auth-title">Відновлення пароля</h1>
    <div class="auth-card">
        <p style="color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; text-align: center;">
            Введіть свій email, і ми надішлемо інструкції для безпечного скидання пароля.
        </p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-btn">Відправити посилання</button>
        </form>
    </div>
</div>
{% endblock %}
