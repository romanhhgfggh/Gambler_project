{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h1 style="color: #f1c40f;">👑 VIP Термінал SMC</h1>
    <p style="color: #7f8c8d; font-size: 1.2rem;">Ексклюзивні інструменти для аналізу ліквідності та макроекономіки.</p>
</div>

<div class="cards-grid">
    <div class="card-smc" style="flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; border-color: #f1c40f;">
        <div style="padding: 15px 20px; background: #2c3e50; color: white;">
            <h2 style="margin: 0; font-size: 1.2rem;">Live Аналіз (BTC/USD & Forex)</h2>
        </div>
        
        <div class="tradingview-widget-container" style="height: 500px; width: 100%;">
            <div id="tradingview_advanced_chart" style="height: 100%; width: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget(
            {
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Europe/Kyiv",
            "theme": "light",
            "style": "1",
            "locale": "uk",
            "enable_publishing": false,
            "backgroundColor": "#ffffff",
            "gridColor": "#f1f3f6",
            "hide_top_toolbar": false,
            "hide_legend": false,
            "save_image": false,
            "container_id": "tradingview_advanced_chart"
            }
            );
            </script>
        </div>
        </div>

    <div class="card-smc" style="flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; border-color: #f39c12; margin-top: 20px;">
        <div style="padding: 15px 20px; background: #2c3e50; color: white;">
            <h2 style="margin: 0; font-size: 1.2rem;">Економічний календар (Уникайте "Червоних" новин)</h2>
        </div>
        
        <div class="tradingview-widget-container" style="height: 400px; width: 100%;">
            <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
            {
            "colorTheme": "light",
            "isTransparent": false,
            "width": "100%",
            "height": "100%",
            "locale": "uk",
            "importanceFilter": "0,1",
            "currencyFilter": "USD,EUR,GBP"
            }
            </script>
        </div>
        </div>
</div>

{% endblock %}
