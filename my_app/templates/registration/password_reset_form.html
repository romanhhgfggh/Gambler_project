{% extends 'pages/base.html' %}

{% block content %}
<div class="page-header">
    <h1>Відновлення пароля</h1>
</div>

<div class="auth-wrapper">
    <div class="card-smc auth-card border-warning">
        <div class="auth-form">
            <p class="auth-text-muted">Введіть ваш email, і ми надішлемо вам посилання для безпечної зміни пароля.</p>
            
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="auth-field">
                        <label class="auth-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            {{ field.errors }}
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-custom btn-warning-custom">Надіслати код на Email</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
